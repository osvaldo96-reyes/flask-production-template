upstream app {
    server app:8000;
    keepalive 16;
}

# 20 peticiones/s por IP, con ráfagas de hasta 40
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # Las métricas solo se leen desde la red interna (Prometheus va directo a app:8000)
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;   # trazabilidad: mismo id en Nginx y en los logs de la app

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
