name: flask-prod

x-app: &app-base
  build: .
  image: ${IMAGE:-flask-prod/app:local}
  environment:
    DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/app
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  read_only: true            # sistema de archivos de solo lectura
  tmpfs: [/tmp]              # único lugar escribible: workers de Gunicorn y métricas
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tarea única: crea el esquema y termina. La app arranca solo si terminó bien.
  migrate:
    <<: *app-base
    command: ["flask", "--app", "wsgi", "init-db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 25s   # > graceful_timeout de Gunicorn
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
